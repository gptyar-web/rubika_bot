services:
  web:
    build:
      context: .
      target: web
    image: rubika-control-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:4173"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  worker:
    profiles: [worker]
    build:
      context: .
      target: worker
    image: rubika-control-worker:local
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SCOPE_SALT: ${SCOPE_SALT:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      RUBIKA_API_BASE: ${RUBIKA_API_BASE:-https://messengerg2b1.iranlms.ir/v3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_BATCH_LIMIT: ${WORKER_BATCH_LIMIT:-5}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      options:
        max-size: "5m"
        max-file: "2"
